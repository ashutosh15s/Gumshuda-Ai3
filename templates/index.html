<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gumshuda | Multi-Agency Case Coordination and Face Matching Grid</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#0284c7', // sky-600
              hover: '#0369a1',   // sky-700
              light: '#e0f2fe'    // sky-100
            },
            page: '#fafafa',       // Neutral 50
            card: '#ffffff',
            subtle: '#f5f5f5',     // Neutral 100
            borderSubtle: '#e5e5e5' // Neutral 200
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tabler Icons CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <style>
    body {
      margin: 0;
      background-color: #fafafa;
      color: #262626;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('login');
      const [token, setToken] = useState(null);
      const [userRole, setUserRole] = useState('NGO_STAFF');
      const [userName, setUserName] = useState('Pooja Verma');
      const [organizations, setOrganizations] = useState([]);

      // Auth States
      const [email, setEmail] = useState('police@gumshuda.org');
      const [password, setPassword] = useState('policePass123');
      const [signupName, setSignupName] = useState('');
      const [signupRole, setSignupRole] = useState('NGO_STAFF');
      const [signupOrgId, setSignupOrgId] = useState('');

      // Police Case Registration States
      const [firNumber, setFirNumber] = useState('');
      const [personName, setPersonName] = useState('');
      const [age, setAge] = useState(12);
      const [gender, setGender] = useState('Female');
      const [missingDate, setMissingDate] = useState('2026-10-25');
      const [district, setDistrict] = useState('Central Delhi');
      const [state, setState] = useState('Delhi');
      const [safeSummary, setSafeSummary] = useState('');
      const [guardianContact, setGuardianContact] = useState('');
      const [casesList, setCasesList] = useState([]);

      // NGO Sighting States
      const [sightingDate, setSightingDate] = useState('2026-10-27');
      const [sightingDistrict, setSightingDistrict] = useState('South Delhi');
      const [sightingState, setSightingState] = useState('Delhi');
      const [sightingNotes, setSightingNotes] = useState('');
      const [sightingCandidates, setSightingCandidates] = useState([]);

      // Upload and Camera States
      const [selectedFiles, setSelectedFiles] = useState([]);
      const [cameraActive, setCameraActive] = useState(false);
      const [isDragOver, setIsDragOver] = useState(false);
      const videoRef = useRef(null);

      // Load initial organizations
      useEffect(() => {
        fetch('/api/admin/organizations')
          .then(res => res.json())
          .then(data => {
            if (Array.isArray(data)) {
              setOrganizations(data);
              if (data.length > 0) setSignupOrgId(data[0].id);
            }
          })
          .catch(() => {});
      }, []);

      const loadCases = async () => {
        if (!token) return;
        try {
          const res = await fetch('/api/cases/', {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok && Array.isArray(data)) setCasesList(data);
        } catch (err) {}
      };

      useEffect(() => {
        if (token) loadCases();
      }, [token, activeTab]);

      // Camera Handlers
      const startCamera = async () => {
        setCameraActive(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          alert('Unable to access camera hardware');
          setCameraActive(false);
        }
      };

      const capturePhoto = () => {
        if (videoRef.current) {
          const canvas = document.createElement('canvas');
          canvas.width = videoRef.current.videoWidth || 640;
          canvas.height = videoRef.current.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.drawImage(videoRef.current, 0, 0);
            canvas.toBlob((blob) => {
              if (blob) {
                const file = new File([blob], `capture_${Date.now()}.jpg`, { type: 'image/jpeg' });
                setSelectedFiles(prev => [...prev, file]);
              }
            }, 'image/jpeg');
          }
          const stream = videoRef.current.srcObject;
          if (stream) stream.getTracks().forEach(track => track.stop());
          setCameraActive(false);
        }
      };

      // File Drag & Drop Handlers
      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragOver(true);
      };

      const handleDragLeave = () => {
        setIsDragOver(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          setSelectedFiles(prev => [...prev, ...Array.from(e.dataTransfer.files)]);
        }
      };

      const handleFileInput = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          setSelectedFiles(prev => [...prev, ...Array.from(e.target.files)]);
        }
      };

      // Authentication
      const handleLogin = async (e) => {
        e.preventDefault();
        const fd = new FormData();
        fd.append('username', email);
        fd.append('password', password);

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            body: fd
          });
          const data = await res.json();
          if (res.ok) {
            setToken(data.access_token);
            setUserRole(data.role);
            setUserName(data.full_name);
            setActiveTab(data.role === 'POLICE_OFFICER' ? 'cases' : 'sightings');
          } else {
            alert(data.detail || 'Authentication failed');
          }
        } catch (err) {
          alert('FastAPI server connection error at /api/auth/login');
        }
      };

      const handleSignup = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email,
              password: password,
              full_name: signupName,
              role: signupRole,
              organization_id: signupOrgId
            })
          });
          const data = await res.json();
          if (res.ok) {
            alert('Registration complete. Please sign in with your credentials.');
            setActiveTab('login');
          } else {
            alert(data.detail || 'Sign up error');
          }
        } catch (err) {
          alert('Network connection error');
        }
      };

      // Case Registration Submission
      const handleCaseSubmit = async (e) => {
        e.preventDefault();
        if (!token) return;

        const fd = new FormData();
        fd.append('person_name', personName);
        fd.append('age', age.toString());
        fd.append('gender', gender);
        fd.append('missing_date', missingDate);
        fd.append('district', district);
        fd.append('state', state);
        fd.append('fir_number', firNumber);
        fd.append('safe_summary', safeSummary);
        if (guardianContact) fd.append('guardian_contact', guardianContact);
        if (selectedFiles.length > 0) {
          fd.append('image', selectedFiles[0]);
        }

        try {
          const res = await fetch('/api/cases/register', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: fd
          });
          if (res.ok) {
            alert('Case registered and vectorized into ChromaDB successfully');
            setPersonName('');
            setFirNumber('');
            setSafeSummary('');
            setGuardianContact('');
            setSelectedFiles([]);
            loadCases();
          } else {
            const error = await res.json();
            alert(error.detail || 'Case registration error');
          }
        } catch (err) {
          alert('FastAPI server unavailable');
        }
      };

      // Sighting Submission
      const handleSightingSubmit = async (e) => {
        e.preventDefault();
        if (!token) return;

        const fd = new FormData();
        fd.append('observed_date', sightingDate);
        fd.append('district', sightingDistrict);
        fd.append('state', sightingState);
        fd.append('context_notes', sightingNotes);
        if (selectedFiles.length > 0) {
          fd.append('image', selectedFiles[0]);
        }

        try {
          const res = await fetch('/api/sightings/submit', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: fd
          });
          const data = await res.json();
          if (res.ok) {
            setSightingCandidates(data.potential_case_leads?.documents?.[0] || []);
            alert('Sighting registered. Potential vector match candidates retrieved.');
          } else {
            alert('Error processing sighting submission');
          }
        } catch (err) {
          alert('Verification query failed');
        }
      };

      return (
        <div className="min-h-screen bg-page text-neutral-800 flex flex-col justify-between">
          
          {/* Header */}
          <header className="border-b border-borderSubtle bg-card sticky top-0 z-40 px-6 py-3.5 flex justify-between items-center shadow-sm">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab(token ? 'sightings' : 'login')}>
              <div className="w-10 h-10 rounded-lg bg-sky-600 flex items-center justify-center text-white">
                <i className="ti ti-shield text-xl"></i>
              </div>
              <div>
                <span className="text-lg font-bold tracking-tight text-neutral-900">GUMSHUDA</span>
                <span className="block text-[10px] text-neutral-500 font-mono">CASE COORDINATION AND VECTOR RETRIEVAL GRID</span>
              </div>
            </div>

            {token ? (
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setActiveTab('sightings')} 
                  className={`text-xs font-semibold px-3 py-1.5 rounded-md transition ${activeTab === 'sightings' ? 'text-sky-600 bg-sky-100' : 'text-neutral-600 hover:text-neutral-900'}`}
                >
                  Report Sighting
                </button>

                {(userRole === 'POLICE_OFFICER' || userRole === 'ADMIN') && (
                  <button 
                    onClick={() => setActiveTab('cases')} 
                    className={`text-xs font-semibold px-3 py-1.5 rounded-md transition ${activeTab === 'cases' ? 'text-sky-600 bg-sky-100' : 'text-neutral-600 hover:text-neutral-900'}`}
                  >
                    Police Station Admin
                  </button>
                )}

                {userRole === 'ADMIN' && (
                  <button 
                    onClick={() => setActiveTab('admin')} 
                    className={`text-xs font-semibold px-3 py-1.5 rounded-md transition ${activeTab === 'admin' ? 'text-sky-600 bg-sky-100' : 'text-neutral-600 hover:text-neutral-900'}`}
                  >
                    System Admin
                  </button>
                )}

                <div className="h-4 w-px bg-borderSubtle mx-2"></div>

                <span className="text-xs bg-subtle px-2.5 py-1 rounded border border-borderSubtle text-neutral-600 font-mono">
                  {userName} ({userRole.replace('_', ' ')})
                </span>

                <button 
                  onClick={() => { setToken(null); setActiveTab('login'); }}
                  className="text-neutral-400 hover:text-neutral-700 p-1"
                  title="Logout"
                >
                  <i className="ti ti-logout text-base"></i>
                </button>
              </div>
            ) : (
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setActiveTab('login')} 
                  className={`text-xs font-semibold px-3 py-1.5 rounded-md ${activeTab === 'login' ? 'text-sky-600 bg-sky-100' : 'text-neutral-600'}`}
                >
                  Login
                </button>
                <button 
                  onClick={() => setActiveTab('signup')} 
                  className={`text-xs font-semibold px-3 py-1.5 rounded-md ${activeTab === 'signup' ? 'text-sky-600 bg-sky-100' : 'text-neutral-600'}`}
                >
                  Sign Up
                </button>
              </div>
            )}
          </header>

          {/* Sub Header Policy Banner */}
          <div className="bg-subtle border-b border-borderSubtle px-6 py-1.5 text-center text-[11px] text-neutral-500 font-mono">
            INVESTIGATIVE DECISION SUPPORT ONLY. AUTOMATED BIOMETRIC AND VECTOR MATCHES CONSTITUTE LEADS AND MUST BE VERIFIED BY INVESTIGATING OFFICERS.
          </div>

          {/* Main Content Area */}
          <main className="max-w-5xl mx-auto w-full px-6 py-8 flex-1">
            
            {/* 1. LOGIN PAGE */}
            {activeTab === 'login' && (
              <div className="max-w-md mx-auto bg-card border border-borderSubtle p-8 rounded-xl shadow-sm space-y-6">
                <div className="text-center">
                  <div className="w-10 h-10 rounded-full bg-sky-100 text-sky-600 mx-auto flex items-center justify-center mb-2">
                    <i className="ti ti-lock text-lg"></i>
                  </div>
                  <h2 className="text-lg font-bold text-neutral-900">Verified Organization Portal</h2>
                  <p className="text-xs text-neutral-500 mt-1">Sign in with authorized police or NGO credentials</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-neutral-600 mb-1">Official Email</label>
                    <input 
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      required
                      className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs focus:border-sky-600 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-600 mb-1">Password</label>
                    <input 
                      type="password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      required
                      className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs focus:border-sky-600 focus:outline-none"
                    />
                  </div>
                  <button 
                    type="submit" 
                    className="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs rounded-lg transition"
                  >
                    Sign In
                  </button>
                </form>

                <div className="border-t border-borderSubtle pt-3 text-center">
                  <span className="text-xs text-neutral-500">Need an account? </span>
                  <button onClick={() => setActiveTab('signup')} className="text-xs text-sky-600 font-semibold hover:underline">
                    Sign up here
                  </button>
                </div>
              </div>
            )}

            {/* 2. SIGN-UP PAGE */}
            {activeTab === 'signup' && (
              <div className="max-w-md mx-auto bg-card border border-borderSubtle p-8 rounded-xl shadow-sm space-y-6">
                <div className="text-center">
                  <div className="w-10 h-10 rounded-full bg-sky-100 text-sky-600 mx-auto flex items-center justify-center mb-2">
                    <i className="ti ti-user-check text-lg"></i>
                  </div>
                  <h2 className="text-lg font-bold text-neutral-900">Request Organization Access</h2>
                  <p className="text-xs text-neutral-500 mt-1">Register verified staff for case tracking and search</p>
                </div>

                <form onSubmit={handleSignup} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-neutral-600 mb-1">Full Name</label>
                    <input 
                      type="text"
                      value={signupName}
                      onChange={(e) => setSignupName(e.target.value)}
                      required
                      placeholder="Officer or Field Representative"
                      className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs focus:border-sky-600 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-600 mb-1">Official Email</label>
                    <input 
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      required
                      placeholder="representative@ngo-or-police.org"
                      className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs focus:border-sky-600 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-600 mb-1">Password</label>
                    <input 
                      type="password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      required
                      className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs focus:border-sky-600 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-600 mb-1">Role</label>
                    <select 
                      value={signupRole} 
                      onChange={(e) => setSignupRole(e.target.value)}
                      className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                    >
                      <option value="NGO_STAFF">Verified NGO Staff</option>
                      <option value="POLICE_OFFICER">Police Case Officer</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-neutral-600 mb-1">Associated Organization</label>
                    <select 
                      value={signupOrgId} 
                      onChange={(e) => setSignupOrgId(e.target.value)}
                      className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                    >
                      {organizations.map(org => (
                        <option key={org.id} value={org.id}>{org.name} ({org.district}, {org.state})</option>
                      ))}
                    </select>
                  </div>
                  <button 
                    type="submit" 
                    className="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs rounded-lg transition"
                  >
                    Complete Registration
                  </button>
                </form>

                <div className="border-t border-borderSubtle pt-3 text-center">
                  <span className="text-xs text-neutral-500">Already registered? </span>
                  <button onClick={() => setActiveTab('login')} className="text-xs text-sky-600 font-semibold hover:underline">
                    Sign in
                  </button>
                </div>
              </div>
            )}

            {/* 3. NGO SIGHTING / REPORT PAGE */}
            {activeTab === 'sightings' && (
              <div className="space-y-6">
                <div className="bg-card border border-borderSubtle p-6 rounded-xl shadow-sm space-y-6">
                  <div className="border-b border-borderSubtle pb-4">
                    <h2 className="text-lg font-bold text-neutral-900">NGO Sighting and Found Person Lead</h2>
                    <p className="text-xs text-neutral-500 mt-0.5">Submit location details and photos to cross match against registered police missing reports.</p>
                  </div>

                  <form onSubmit={handleSightingSubmit} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Date Sighted</label>
                      <input 
                        type="date" 
                        value={sightingDate} 
                        onChange={(e) => setSightingDate(e.target.value)} 
                        required 
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">District</label>
                      <input 
                        type="text" 
                        value={sightingDistrict} 
                        onChange={(e) => setSightingDistrict(e.target.value)} 
                        required 
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">State</label>
                      <input 
                        type="text" 
                        value={sightingState} 
                        onChange={(e) => setSightingState(e.target.value)} 
                        required 
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>

                    <div className="md:col-span-3">
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Observational Notes for RAG Vector Comparison</label>
                      <textarea 
                        value={sightingNotes} 
                        onChange={(e) => setSightingNotes(e.target.value)} 
                        required
                        rows={2} 
                        placeholder="Specify approximate age, identifying physical marks, clothes, or shelter context"
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>

                    {/* Drag and Drop / Camera Zone */}
                    <div className="md:col-span-3">
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Attached Sighting Evidence</label>
                      <div 
                        onDragOver={handleDragOver}
                        onDragLeave={handleDragLeave}
                        onDrop={handleDrop}
                        className={`border-2 border-dashed rounded-xl p-6 text-center transition bg-subtle ${isDragOver ? 'border-sky-600 bg-sky-50' : 'border-neutral-300'}`}
                      >
                        <div className="flex flex-col items-center justify-center gap-1.5">
                          <i className="ti ti-upload text-sky-600 text-2xl"></i>
                          <span className="text-xs font-semibold text-neutral-700">Drag and drop field photos, or select a file</span>
                          <input 
                            type="file" 
                            accept="image/*"
                            onChange={handleFileInput}
                            className="text-xs text-neutral-500 mt-1"
                          />
                          <div className="pt-2">
                            <button 
                              type="button" 
                              onClick={startCamera} 
                              className="inline-flex items-center gap-1.5 px-3 py-1.5 border border-borderSubtle bg-card rounded-md text-xs font-semibold text-neutral-700 hover:bg-neutral-50"
                            >
                              <i className="ti ti-camera"></i> Click Picture with Camera
                            </button>
                          </div>
                        </div>

                        {cameraActive && (
                          <div className="mt-4 flex flex-col items-center">
                            <video ref={videoRef} autoPlay playsInline className="w-64 h-48 object-cover rounded-lg border border-borderSubtle" />
                            <button 
                              type="button" 
                              onClick={capturePhoto} 
                              className="mt-2 px-3 py-1.5 bg-sky-600 text-white rounded text-xs font-semibold"
                            >
                              Capture Snapshot
                            </button>
                          </div>
                        )}
                      </div>

                      {selectedFiles.length > 0 && (
                        <div className="mt-3 flex flex-wrap gap-2">
                          {selectedFiles.map((file, i) => (
                            <span key={i} className="text-[11px] font-mono bg-card px-2.5 py-1 rounded border border-borderSubtle text-neutral-700">
                              {file.name}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="md:col-span-3">
                      <button 
                        type="submit" 
                        className="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm"
                      >
                        Submit Sighting and Run Lead Retrieval
                      </button>
                    </div>
                  </form>
                </div>

                {/* Match Review Section */}
                {sightingCandidates.length > 0 && (
                  <div className="bg-card border border-borderSubtle p-6 rounded-xl shadow-sm space-y-4">
                    <div className="flex items-center justify-between border-b border-borderSubtle pb-3">
                      <span className="text-xs font-bold text-neutral-800 uppercase tracking-wide">
                        Possible Matches (Investigative Leads)
                      </span>
                      <span className="text-[11px] font-mono bg-sky-100 text-sky-800 px-2 py-0.5 rounded">
                        Confidence: PROBABLE
                      </span>
                    </div>

                    <div className="space-y-3">
                      {sightingCandidates.map((candidate, idx) => (
                        <div key={idx} className="bg-subtle border border-borderSubtle p-4 rounded-lg text-xs space-y-2">
                          <div className="flex justify-between items-start">
                            <span className="font-semibold text-neutral-800">Retrieved Candidate Record</span>
                            <span className="font-mono text-neutral-500">Tier: Strong Lead</span>
                          </div>
                          <p className="text-neutral-600 leading-relaxed">{candidate}</p>
                          
                          {/* Contact Bridge */}
                          <div className="mt-3 pt-3 border-t border-borderSubtle flex justify-between items-center text-[11px]">
                            <span className="text-neutral-500 font-mono">
                              Direct Liaison: Originating Thana / AHTU Officer
                            </span>
                            <button className="px-3 py-1 bg-card border border-borderSubtle hover:border-sky-600 text-sky-600 font-semibold rounded">
                              Contact Originating Station
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 4. POLICE STATION ADMIN PAGE */}
            {activeTab === 'cases' && (
              <div className="space-y-6">
                <div className="bg-card border border-borderSubtle p-6 rounded-xl shadow-sm space-y-6">
                  <div className="border-b border-borderSubtle pb-4">
                    <h2 className="text-lg font-bold text-neutral-900">Police Station Case Registration</h2>
                    <p className="text-xs text-neutral-500 mt-0.5">Vectorize missing person profiles to the nationwide coordination mesh.</p>
                  </div>

                  <form onSubmit={handleCaseSubmit} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">FIR or GD Number</label>
                      <input 
                        type="text" 
                        value={firNumber} 
                        onChange={(e) => setFirNumber(e.target.value)} 
                        required 
                        placeholder="FIR-381/2026"
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Subject Full Name</label>
                      <input 
                        type="text" 
                        value={personName} 
                        onChange={(e) => setPersonName(e.target.value)} 
                        required 
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Age</label>
                      <input 
                        type="number" 
                        value={age} 
                        onChange={(e) => setAge(parseInt(e.target.value))} 
                        required 
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Gender</label>
                      <select 
                        value={gender} 
                        onChange={(e) => setGender(e.target.value)}
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      >
                        <option>Female</option>
                        <option>Male</option>
                        <option>Other</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">District</label>
                      <input 
                        type="text" 
                        value={district} 
                        onChange={(e) => setDistrict(e.target.value)} 
                        required 
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">State</label>
                      <input 
                        type="text" 
                        value={state} 
                        onChange={(e) => setState(e.target.value)} 
                        required 
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>

                    <div className="md:col-span-3">
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Descriptive Features for ChromaDB RAG Search</label>
                      <textarea 
                        value={safeSummary} 
                        onChange={(e) => setSafeSummary(e.target.value)} 
                        required
                        rows={3} 
                        placeholder="Describe identifying physical marks, clothing, or circumstances without sensitive guardian details"
                        className="w-full bg-subtle border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>

                    {/* Restricted Guardian Section */}
                    <div className="md:col-span-3 border border-borderSubtle rounded-lg p-3 bg-subtle/50">
                      <label className="block text-xs font-semibold text-neutral-700 mb-1">
                        Restricted Guardian Contact (Station Internal Records Only)
                      </label>
                      <input 
                        type="text" 
                        value={guardianContact} 
                        onChange={(e) => setGuardianContact(e.target.value)} 
                        placeholder="Family contact phone or address. Hidden from non-police callers"
                        className="w-full bg-card border border-borderSubtle rounded-lg px-3 py-2 text-xs"
                      />
                    </div>

                    {/* Multi-Image Upload & Camera */}
                    <div className="md:col-span-3">
                      <label className="block text-xs font-semibold text-neutral-600 mb-1">Case Photographs (1 to 5 images recommended)</label>
                      <div 
                        onDragOver={handleDragOver}
                        onDragLeave={handleDragLeave}
                        onDrop={handleDrop}
                        className={`border-2 border-dashed rounded-xl p-6 text-center transition bg-subtle ${isDragOver ? 'border-sky-600 bg-sky-50' : 'border-neutral-300'}`}
                      >
                        <div className="flex flex-col items-center justify-center gap-1.5">
                          <i className="ti ti-upload text-sky-600 text-2xl"></i>
                          <span className="text-xs font-semibold text-neutral-700">Drag and drop verified photographs, or click to browse</span>
                          <input 
                            type="file" 
                            multiple 
                            accept="image/*"
                            onChange={handleFileInput}
                            className="text-xs text-neutral-500 mt-1"
                          />
                          <div className="pt-2">
                            <button 
                              type="button" 
                              onClick={startCamera} 
                              className="inline-flex items-center gap-1.5 px-3 py-1.5 border border-borderSubtle bg-card rounded-md text-xs font-semibold text-neutral-700 hover:bg-neutral-50"
                            >
                              <i className="ti ti-camera"></i> Click Picture with Camera
                            </button>
                          </div>
                        </div>

                        {cameraActive && (
                          <div className="mt-4 flex flex-col items-center">
                            <video ref={videoRef} autoPlay playsInline className="w-64 h-48 object-cover rounded-lg border border-borderSubtle" />
                            <button 
                              type="button" 
                              onClick={capturePhoto} 
                              className="mt-2 px-3 py-1.5 bg-sky-600 text-white rounded text-xs font-semibold"
                            >
                              Capture Snapshot
                            </button>
                          </div>
                        )}
                      </div>

                      {selectedFiles.length > 0 && (
                        <div className="mt-3 flex flex-wrap gap-2">
                          {selectedFiles.map((file, i) => (
                            <span key={i} className="text-[11px] font-mono bg-card px-2.5 py-1 rounded border border-borderSubtle text-neutral-700 flex items-center gap-1">
                              <i className="ti ti-check text-sky-600"></i> {file.name}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="md:col-span-3">
                      <button 
                        type="submit" 
                        className="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-lg shadow-sm"
                      >
                        Commit Record to Vector Database
                      </button>
                    </div>
                  </form>
                </div>

                {/* Registered Cases Table */}
                <div className="bg-card border border-borderSubtle rounded-xl shadow-sm overflow-hidden">
                  <div className="p-4 border-b border-borderSubtle bg-subtle">
                    <span className="text-xs font-bold text-neutral-800">Station Managed Registry Records</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-subtle text-neutral-500 font-mono border-b border-borderSubtle">
                        <tr>
                          <th className="py-2.5 px-4">CASE ID</th>
                          <th className="py-2.5 px-4">SUBJECT NAME</th>
                          <th className="py-2.5 px-4">AGE / GENDER</th>
                          <th className="py-2.5 px-4">DISTRICT / STATE</th>
                          <th className="py-2.5 px-4">STATUS</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-borderSubtle">
                        {casesList.map(c => (
                          <tr key={c.id}>
                            <td className="py-2.5 px-4 font-mono font-semibold text-neutral-700">{c.case_number}</td>
                            <td className="py-2.5 px-4 text-neutral-800">{c.person_name}</td>
                            <td className="py-2.5 px-4 text-neutral-600">{c.age} / {c.gender}</td>
                            <td className="py-2.5 px-4 text-neutral-600">{c.district}, {c.state}</td>
                            <td className="py-2.5 px-4">
                              <span className="px-2 py-0.5 bg-subtle border border-borderSubtle rounded text-[11px] font-mono text-neutral-600">
                                {c.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 5. SYSTEM ADMIN VIEW */}
            {activeTab === 'admin' && (
              <div className="bg-card border border-borderSubtle p-6 rounded-xl shadow-sm space-y-6">
                <div className="border-b border-borderSubtle pb-4">
                  <h2 className="text-lg font-bold text-neutral-900">System Directory and Verification Metrics</h2>
                  <p className="text-xs text-neutral-500 mt-0.5">Authorized NGOs and police anti-human trafficking units in the national mesh.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {organizations.map(org => (
                    <div key={org.id} className="p-4 bg-subtle border border-borderSubtle rounded-lg text-xs space-y-1">
                      <span className="font-bold text-neutral-800 text-sm block">{org.name}</span>
                      <span className="font-mono text-neutral-500 block">Unit Type: {org.org_type}</span>
                      <span className="text-neutral-600 block">{org.district}, {org.state}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-borderSubtle py-4 text-center text-xs text-neutral-400 bg-card font-mono">
            GUMSHUDA ANTI-TRAFFICKING MESH 2026. RESTRICTED ACCESS TO VERIFIED PARTICIPANTS ONLY.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
